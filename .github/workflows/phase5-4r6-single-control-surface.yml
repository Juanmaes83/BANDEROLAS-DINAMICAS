name: Phase 5.4R6 Single Control Surface Verify
on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/workspace-single-control-surface.js'
      - 'scripts/verify-phase5-4r6-single-control-surface.mjs'
      - '.github/workflows/phase5-4r6-single-control-surface.yml'
  push:
    branches:
      - feat/phase5-4a-extended-restaurant-page
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check src/workspace-single-control-surface.js
      - name: Phase 5.4R6 contract
        run: node scripts/verify-phase5-4r6-single-control-surface.mjs
