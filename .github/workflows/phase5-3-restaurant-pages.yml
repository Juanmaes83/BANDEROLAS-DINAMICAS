name: Phase 5.3 Restaurant Pages Verify

on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/presets/restaurant-menu-pages.js'
      - 'scripts/verify-phase5-3-restaurant-pages.mjs'
      - '.github/workflows/phase5-3-restaurant-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check src/presets/restaurant-menu-pages.js
      - name: Phase 5.3 contract
        run: node scripts/verify-phase5-3-restaurant-pages.mjs
