name: Phase 5.1 Verify

on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/presets/restaurant-menu-premium.js'
      - 'scripts/verify-phase5-1-restaurant-menu.mjs'
      - '.github/workflows/phase5-1-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 5.1 static regression
        run: node scripts/verify-phase5-1-restaurant-menu.mjs
