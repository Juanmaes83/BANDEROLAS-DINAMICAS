name: Restaurant Physical Surface Regression

on:
  pull_request:
    paths:
      - 'src/presets/restaurant-menu-premium.js'
      - 'src/presets/restaurant-menu-pages.js'
      - 'src/interaction-stable.js'
      - 'src/editor-base.html'
      - 'src/surfaces/classic-fabric-adapter.js'
      - 'src/surfaces/paper3d-studio.js'
      - 'src/surfaces/paper3d-adapter.js'
      - 'scripts/verify-restaurant-physical-surface-regression.mjs'
      - '.github/workflows/restaurant-physical-surface-regression.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check src/presets/restaurant-menu-premium.js
          node --check src/presets/restaurant-menu-pages.js
          node --check src/surfaces/classic-fabric-adapter.js
      - name: Physical surface + Variant regression
        run: node scripts/verify-restaurant-physical-surface-regression.mjs
