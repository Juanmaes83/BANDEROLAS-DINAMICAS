<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANDEROLAS PRO · Physics A/B Lab</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#080504;color:#ddd;font-family:ui-monospace,monospace}header{padding:18px 22px;border-bottom:1px solid #392f29;color:#d4af37}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;height:calc(100vh - 72px)}.card{position:relative;background:#120a07;border:1px solid #382d28;min-height:420px;overflow:hidden}.label{position:absolute;left:12px;top:12px;z-index:2;background:rgba(0,0,0,.65);padding:8px 10px;font-size:11px}.label b{color:#d4af37}.label small{display:block;color:#aaa;margin-top:4px;max-width:340px;line-height:1.35}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}@media(max-width:850px){main{grid-template-columns:1fr;height:auto}.card{height:60vh}}</style></head>
<body><header><b>BANDEROLAS PRO · PHYSICS A/B LAB</b> — isolated test; it does not modify production.</header><main>
<div class="card"><div class="label"><b>A · CURRENT VALIDATED</b><small>Single 60 fps step · current damping/tension feel.</small></div><canvas id="a"></canvas></div>
<div class="card"><div class="label"><b>B · BREEZE-INSPIRED</b><small>6 substeps/frame (~360 Hz target) + position smoothing. Compare stability and recovery before any production migration.</small></div><canvas id="b"></canvas></div>
</main><script>
'use strict';
function sim(canvas,mode){const ctx=canvas.getContext('2d');let ps=[],cs=[],grab=null,mx=0,my=0,last=performance.now();const cols=24,rows=34;
function size(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;build()}addEventListener('resize',size);
function build(){ps=[];cs=[];const W=canvas.width*.46,H=canvas.height*.68,sx=W/(cols-1),sy=H/(rows-1),ox=(canvas.width-W)/2,oy=canvas.height*.16;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const X=ox+x*sx,Y=oy+y*sy;ps.push({x:X,y:Y,ox:X,oy:Y,sx:X,sy:Y,p:y===0})}const add=(i,j,k=1)=>cs.push({a:ps[i],b:ps[j],r:Math.hypot(ps[i].x-ps[j].x,ps[i].y-ps[j].y),k});for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=y*cols+x;if(x<cols-1)add(i,i+1);if(y<rows-1)add(i,i+cols);if(x<cols-1&&y<rows-1){add(i,i+cols+1,.9);add(i+1,i+cols,.9)}}}
function step(){const sub=mode==='b'?6:1,damp=mode==='b'?.992:.92,grav=mode==='b'?.055:.32;for(let s=0;s<sub;s++){for(const p of ps){if(p.p)continue;let vx=(p.x-p.ox)*damp,vy=(p.y-p.oy)*damp;p.ox=p.x;p.oy=p.y;p.x+=vx;p.y+=vy+grav;if(grab===p){p.x+=(mx-p.x)*.34;p.y+=(my-p.y)*.34}}for(let it=0;it<(mode==='b'?3:10);it++)for(const c of cs){let dx=c.a.x-c.b.x,dy=c.a.y-c.b.y,d=Math.hypot(dx,dy)||1,df=((d-c.r)/d)*.5*c.k*(mode==='b'?.28:.92),x=dx*df,y=dy*df;if(!c.a.p&&c.a!==grab){c.a.x-=x;c.a.y-=y}if(!c.b.p&&c.b!==grab){c.b.x+=x;c.b.y+=y}}}if(mode==='b')for(const p of ps){p.sx+=(p.x-p.sx)*.25;p.sy+=(p.y-p.sy)*.25}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#8c785e';ctx.lineWidth=Math.max(1,devicePixelRatio);ctx.beginPath();for(let y=0;y<rows;y++)for(let x=0;x<cols-1;x++){const a=ps[y*cols+x],b=ps[y*cols+x+1],ax=mode==='b'?a.sx:a.x,ay=mode==='b'?a.sy:a.y,bx=mode==='b'?b.sx:b.x,by=mode==='b'?b.sy:b.y;ctx.moveTo(ax,ay);ctx.lineTo(bx,by)}for(let y=0;y<rows-1;y++)for(let x=0;x<cols;x++){const a=ps[y*cols+x],b=ps[(y+1)*cols+x],ax=mode==='b'?a.sx:a.x,ay=mode==='b'?a.sy:a.y,bx=mode==='b'?b.sx:b.x,by=mode==='b'?b.sy:b.y;ctx.moveTo(ax,ay);ctx.lineTo(bx,by)}ctx.stroke()}
function frame(t){step();last=t;draw();requestAnimationFrame(frame)}
function pos(e){const r=canvas.getBoundingClientRect(),q=e.touches?.[0]||e;return{x:(q.clientX-r.left)*devicePixelRatio,y:(q.clientY-r.top)*devicePixelRatio}}
function down(e){const p=pos(e);mx=p.x;my=p.y;let d=80*80*devicePixelRatio*devicePixelRatio;for(const q of ps){if(q.p)continue;const dd=(q.x-mx)**2+(q.y-my)**2;if(dd<d){d=dd;grab=q}}}function move(e){if(!grab)return;e.preventDefault();const p=pos(e);mx=p.x;my=p.y}function up(){grab=null}
canvas.addEventListener('mousedown',down);addEventListener('mousemove',move,{passive:false});addEventListener('mouseup',up);canvas.addEventListener('touchstart',down,{passive:false});addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up);canvas.addEventListener('dblclick',build);size();requestAnimationFrame(frame)}
sim(document.getElementById('a'),'a');sim(document.getElementById('b'),'b');
</script></body></html>
